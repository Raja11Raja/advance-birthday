<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Birthday Surprise</title>

<style>

body{
margin:0;
font-family:Arial;
text-align:center;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
color:white;
overflow:hidden;
}

h1{
margin-top:40px;
font-size:40px;
}

#countdown{
font-size:28px;
margin-top:10px;
font-weight:bold;
}

img{
margin-top:20px;
width:230px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

#message{
margin-top:20px;
font-size:24px;
min-height:40px;
}

.balloon{
position:absolute;
bottom:-120px;
font-size:40px;
animation:float 8s linear infinite;
}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}

canvas{
position:absolute;
top:0;
left:0;
pointer-events:none;
}

/* Cake Design */

#cakeArea{
display:none;
margin-top:30px;
}

.cake{
width:220px;
height:120px;
background:#ffb347;
border-radius:10px;
position:relative;
margin:auto;
}

.cream{
width:220px;
height:30px;
background:white;
position:absolute;
top:-15px;
border-radius:20px;
}

.candle{
width:10px;
height:35px;
background:red;
position:absolute;
top:-50px;
left:105px;
}

.flame{
width:12px;
height:12px;
background:yellow;
border-radius:50%;
position:absolute;
top:-62px;
left:104px;
animation:flicker 0.3s infinite alternate;
}

@keyframes flicker{
from{transform:scale(1)}
to{transform:scale(1.2)}
}

.knife{
width:120px;
height:6px;
background:silver;
position:absolute;
top:40px;
left:-130px;
animation:cut 4s forwards;
}

@keyframes cut{
0%{left:-130px}
50%{left:60px}
100%{left:60px}
}

.slice{
width:110px;
height:120px;
background:#ffb347;
position:absolute;
left:110px;
display:none;
}

.cut .slice{
display:block;
}

</style>
</head>

<body>

<h1>🎉 Advance Happy Birthday Junioreey💙🥰🫂🎂</h1>

<div id="countdown"></div>

<img src="photo.jpeg">

<div id="message"></div>

<div class="balloon" style="left:10%">🎈</div>
<div class="balloon" style="left:25%">🎈</div>
<div class="balloon" style="left:40%">🎈</div>
<div class="balloon" style="left:55%">🎈</div>
<div class="balloon" style="left:70%">🎈</div>
<div class="balloon" style="left:85%">🎈</div>

<canvas id="fireworks"></canvas>

<div id="cakeArea">
<div class="cake" id="cake">
<div class="cream"></div>
<div class="candle"></div>
<div class="flame"></div>
<div class="knife"></div>
<div class="slice"></div>
</div>
</div>

<script>

var birthday = new Date("March 26, 2026 00:00:00").getTime();

setInterval(function(){

var now = new Date().getTime();
var distance = birthday - now;

var days = Math.floor(distance/(1000*60*60*24));
var hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
var minutes = Math.floor((distance%(1000*60*60))/(1000*60));
var seconds = Math.floor((distance%(1000*60))/1000);

document.getElementById("countdown").innerHTML =
days+" Days "+hours+" Hours "+minutes+" Minutes "+seconds+" Seconds ";

if(distance<0){

document.getElementById("countdown").innerHTML="🎉 Happy Birthday 🎉";
document.getElementById("cakeArea").style.display="block";

setTimeout(function(){
document.getElementById("cake").classList.add("cut");
},2000);

}

},1000);


/* typing message */

var text="💙🥰🫂Advance Happy Bithday Eruma Maadu💙🫂";
var i=0;

function typeWriter(){
if(i<text.length){
document.getElementById("message").innerHTML+=text.charAt(i);
i++;
setTimeout(typeWriter,50);
}
}

typeWriter();


/* fireworks */

var canvas=document.getElementById("fireworks");
var ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

function firework(){

var x=Math.random()*canvas.width;
var y=Math.random()*canvas.height/2;

for(var i=0;i<40;i++){

ctx.beginPath();
ctx.arc(x+(Math.random()*100-50),y+(Math.random()*100-50),3,0,Math.PI*2);
ctx.fillStyle="white";
ctx.fill();

}

setTimeout(function(){
ctx.clearRect(0,0,canvas.width,canvas.height);
},400);

}

setInterval(firework,800);

</script>

</body>
</html>
